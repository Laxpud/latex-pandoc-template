[project]
name = "latex-pandoc-template"
version = "0.1.0"
description = "Pandoc helpers for converting LaTeX manuscripts to Word."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lxml>=5.3.0",
    "PyMuPDF>=1.24.0",
]

[project.scripts]
lpt-docx = "lpt_docx.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
# 转换模块和默认资源均位于包内，源码与安装包不再使用两套路径映射。
packages = ["src/lpt_docx"]

# 配置 uv 使用清华镜像源加速下载
[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
